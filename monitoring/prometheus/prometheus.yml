# Prometheus Configuration for SupoClip

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'supoclip'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Scrape configurations
scrape_configs:
  # SupoClip Backend
  - job_name: 'supoclip-backend'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'
          app: 'supoclip'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # SupoClip Worker
  - job_name: 'supoclip-worker'
    static_configs:
      - targets: ['worker:8001']  # Worker needs to expose metrics on port 8001
        labels:
          service: 'worker'
          app: 'supoclip'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # PostgreSQL Exporter (optional)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          app: 'supoclip'
    scrape_interval: 30s

  # Redis Exporter (optional)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          app: 'supoclip'
    scrape_interval: 30s

  # Node Exporter for host metrics (optional)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
          app: 'supoclip'
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          app: 'supoclip'
