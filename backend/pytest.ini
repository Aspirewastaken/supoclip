[pytest]
# Pytest configuration for SupoClip backend

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    # Verbosity and output
    -v
    --tb=short
    --strict-markers

    # Coverage
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml

    # Warnings
    -W ignore::DeprecationWarning

    # Async support
    --asyncio-mode=auto

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may need services)
    slow: Slow tests (video processing, AI calls)
    requires_api: Tests requiring external API keys
    requires_ffmpeg: Tests requiring ffmpeg
    requires_video: Tests requiring video files

# Async configuration
asyncio_mode = auto

# Coverage settings
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
