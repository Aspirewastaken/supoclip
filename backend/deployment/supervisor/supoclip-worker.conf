; SupoClip ARQ Worker - Supervisor Configuration
; Installation:
;   1. Copy to /etc/supervisor/conf.d/supoclip-worker.conf
;   2. Run: sudo supervisorctl reread
;   3. Run: sudo supervisorctl update
;   4. Run: sudo supervisorctl start supoclip-worker

[program:supoclip-worker]
; Command to run (adjust paths as needed)
command=/opt/supoclip/backend/.venv/bin/arq src.workers.tasks.WorkerSettings
directory=/opt/supoclip/backend

; User to run as (create with: sudo useradd -r supoclip)
user=supoclip

; Number of processes to run (scale workers)
numprocs=1
numprocs_start=1
process_name=%(program_name)s_%(process_num)02d

; Auto-start and restart
autostart=true
autorestart=true
startretries=3

; Stop handling
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

; Logging
stdout_logfile=/var/log/supoclip/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/supoclip/worker-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
redirect_stderr=false

; Environment variables
environment=
    PYTHONPATH="/opt/supoclip/backend",
    PYTHONUNBUFFERED="1",
    REDIS_HOST="localhost",
    REDIS_PORT="6379"

; Priority (lower = start earlier, default=999)
priority=100

; Startup wait time
startsecs=5

; Resource limits (requires supervisor >= 3.2)
; Set to 0 for unlimited
umask=022
